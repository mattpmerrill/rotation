name: cycle-signal
# Daily job: shared cycle state + every person's actions -> Supabase; public brief -> Discord
# (shares only, never holdings or amounts). Posts on action days, plus a Sunday summary.
# Holdings come from each person's trade log in the app, not from secrets.
on:
  schedule:
    - cron: "15 13 * * *"   # 13:15 UTC daily, after CoinMetrics publishes the prior day
  workflow_dispatch:
    inputs:
      force_post:
        description: "Post even if there is no action today (for testing)"
        type: boolean
        default: false

jobs:
  daily:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: engine } }
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}   # public: shares only
      COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}       # optional: alt prices (free Demo key)
      COINGECKO_PLAN: demo
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - name: Daily job
        run: |
          if [ -z "$SUPABASE_DB_URL" ] || [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "SUPABASE_DB_URL / DISCORD_WEBHOOK_URL secrets not set: skipping"; exit 0
          fi
          uv run rotation daily --post $([ "${{ inputs.force_post }}" = "true" ] || echo --only-if-action)
