name: cycle-signal
# Daily BTC cycle-harvest signal -> Discord. Posts only when an action is due, plus a
# Sunday summary. Holdings are secrets (not variables) so collaborators can't read them.
on:
  schedule:
    - cron: "15 13 * * *"   # 13:15 UTC daily, after CoinMetrics publishes the prior day
  workflow_dispatch:
    inputs:
      force_post:
        description: "Post even if there is no action today (for testing)"
        type: boolean
        default: false

jobs:
  signal:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: engine } }
    env:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}                   # public: shares only
      DISCORD_PRIVATE_WEBHOOK_URL: ${{ secrets.DISCORD_PRIVATE_WEBHOOK_URL }}   # optional: exact amounts
      HOLDINGS_BTC: ${{ secrets.HOLDINGS_BTC }}
      HOLDINGS_USDT: ${{ secrets.HOLDINGS_USDT }}
      SOLD_THIS_CYCLE: ${{ secrets.SOLD_THIS_CYCLE }}
      TRANCHES_BOUGHT: ${{ secrets.TRANCHES_BOUGHT }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - name: Signal
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ] || [ -z "$HOLDINGS_BTC" ]; then
            echo "DISCORD_WEBHOOK_URL / HOLDINGS_BTC secrets not set yet: skipping"; exit 0
          fi
          uv run rotation signal --btc "$HOLDINGS_BTC" --usdt "${HOLDINGS_USDT:-0}" \
            --sold "${SOLD_THIS_CYCLE:-0}" --tranches-bought "${TRANCHES_BOUGHT:-0}" \
            --post $([ "${{ inputs.force_post }}" = "true" ] || echo --only-if-action)
