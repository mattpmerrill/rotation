name: security
# Secret and dependency scanning (engineering-standards.md, CI quality gates). Also runs weekly,
# because a dependency can become vulnerable without a code change.
on:
  push: { branches: [main] }
  pull_request:
  schedule:
    - cron: "17 9 * * 1"

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 } # the whole history: a committed secret stays in it
      - name: Install gitleaks 8.30.1 (pinned, checksum verified)
        run: |
          base=https://github.com/gitleaks/gitleaks/releases/download/v8.30.1
          curl -sSfLO "$base/gitleaks_8.30.1_linux_x64.tar.gz"
          curl -sSfLO "$base/gitleaks_8.30.1_checksums.txt"
          sha256sum --ignore-missing -c gitleaks_8.30.1_checksums.txt
          tar -xzf gitleaks_8.30.1_linux_x64.tar.gz gitleaks
      - run: ./gitleaks git --redact --no-banner --verbose

  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: npm, cache-dependency-path: web/package-lock.json }
      - name: Web dependencies (fail on high or critical)
        working-directory: web
        run: npm audit --audit-level=high
      - uses: astral-sh/setup-uv@v6
      - name: Engine dependencies
        working-directory: engine
        run: |
          uv export --frozen --no-hashes --no-emit-project -o "$RUNNER_TEMP/requirements.txt"
          uvx pip-audit -r "$RUNNER_TEMP/requirements.txt" --no-deps --disable-pip
