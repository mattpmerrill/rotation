name: daily
# 1. Engine: today's market state and prices -> Supabase.
# 2. Web app: value every entry and post what's new to Discord (the app decides what, and
#    posts each thing once).
on:
  schedule:
    - cron: "15 13 * * *"   # 13:15 UTC, after CoinMetrics publishes the prior day
  workflow_dispatch:

jobs:
  daily:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Market data
        working-directory: engine
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
          COINGECKO_PLAN: demo
        run: |
          uv sync --frozen
          uv run rotation daily
      - name: Notifications
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl --fail-with-body -sS -X POST "$APP_URL/api/jobs/daily" \
            -H "Authorization: Bearer $CRON_SECRET"
