# Rotation rule configuration. Every threshold the engine uses lives here.
#
# Conventions
#   - Fractions, not percents: 0.30 means 30%.
#   - Windows are in days unless the key says weeks.
#   - Keys marked "# DEFAULT" are proposed definitions for things the program doc
#     left open. The program doc is docs/archive/RULES.md.
#   - Any change here: bump `version` and add a line to docs/CHANGELOG-RULES.md.
#     Every engine output records the sha256 of this file.

version: 2

cycle:                                # BTC cycle harvest (Matt, 2026-09-24): the primary strategy
  halvings: [2012-11-28, 2016-07-09, 2020-05-11, 2024-04-19]   # add the next one when it happens
  sell:
    window_start_days: 500            # chosen on 2012-2020 (archived study, see ADR-004)
    window_end_days: 580              # leave-one-cycle-out pick (0% tax, 1% fee per trade)
    clock_tranches: 4
    trend_weekly_sma: 20
  buy:
    start_days_since_ath: 360
    start_drawdown: 0.80
    start_mvrv_below: 1.0
    tranches: 4
    spacing_days: 30
    deadline_days_since_ath: 540
