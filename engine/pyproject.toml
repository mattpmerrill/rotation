[project]
name = "rotation"
version = "0.1.0"
description = "Rotation engine: data, rules and backtests for a BTC-denominated alt portfolio"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pandas>=2.2",
    "pyarrow>=17",
    "pydantic>=2.8",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "typer>=0.12",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
rotation = "rotation.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rotation"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: hits a live external API (deselect with -m 'not network')"]
addopts = "-m 'not network'"

[tool.ruff]
line-length = 100
target-version = "py312"
